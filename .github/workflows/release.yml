name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version / tag (e.g. 2026.9.3). Leave empty to use git tag or latest upstream.'
        required: false
        default: ''
      draft:
        description: 'Publish as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows ARM64 & Publish Release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> $GITHUB_PATH
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Determine Release Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r .tag_name)
            VERSION="${LATEST_TAG#v}"
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${VERSION}" >> $GITHUB_ENV
          echo "Selected version: ${VERSION}"

      - name: Download Official Cloudflare Release Assets
        run: |
          mkdir -p dist
          echo "Fetching upstream release assets for ${VERSION}..."
          gh release download "${VERSION}" --repo cloudflare/cloudflared --dir dist/ || echo "Upstream assets download skipped or partial"
          gh release view "${VERSION}" --repo cloudflare/cloudflared --json body -q .body > body.txt || echo "### Release ${VERSION}" > body.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows ARM64 (.exe and .msi)
        run: |
          export PATH="$PATH:$USERPROFILE/.dotnet/tools:$HOME/.dotnet/tools"
          BUILD_DATE=$(date -u '+%Y-%m-%d-%H:%M UTC')
          
          echo "Building cloudflared-windows-arm64.exe for ${VERSION}..."
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -mod=readonly \
            -ldflags="-X 'main.Version=${VERSION}' -X 'main.BuildTime=${BUILD_DATE}' -s -w" \
            -o dist/cloudflared-windows-arm64.exe \
            github.com/cloudflare/cloudflared/cmd/cloudflared

          # Build Windows ARM64 MSI installer using WiX
          cp dist/cloudflared-windows-arm64.exe ./cloudflared.exe
          MSI_VERSION=$(echo "${VERSION}" | grep -oE '^[0-9]+(\.[0-9]+){1,2}' || echo "1.0.0")
          dots=$(echo "${MSI_VERSION}" | tr -cd '.' | wc -c)
          if [ "$dots" -eq 1 ]; then MSI_VERSION="${MSI_VERSION}.0"; fi
          
          echo "Converting cloudflared.wxs to WiX v4/v5..."
          wix convert cloudflared.wxs || true
          
          echo "Building cloudflared-windows-arm64.msi with version ${MSI_VERSION}..."
          wix build -arch arm64 -d Platform=arm64 -d Version="${MSI_VERSION}" -d Path=./cloudflared.exe cloudflared.wxs -o dist/cloudflared-windows-arm64.msi
          ls -lh dist/cloudflared-windows-arm64.*

      - name: Update Release Notes with Checksums
        run: |
          python3 - << 'EOF'
          import hashlib, os

          def get_sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  while chunk := f.read(8192):
                      h.update(chunk)
              return h.hexdigest()

          entries = []
          exe_path = 'dist/cloudflared-windows-arm64.exe'
          msi_path = 'dist/cloudflared-windows-arm64.msi'

          if os.path.exists(exe_path):
              entries.append(f"cloudflared-windows-arm64.exe: {get_sha256(exe_path)}\n")
          if os.path.exists(msi_path):
              entries.append(f"cloudflared-windows-arm64.msi: {get_sha256(msi_path)}\n")

          content = ""
          if os.path.exists('body.txt'):
              with open('body.txt', 'r', encoding='utf-8') as f:
                  content = f.read()

          if '```' in content:
              idx = content.rfind('```')
              content = content[:idx] + "".join(entries) + content[idx:]
          else:
              content = content + "\n### Windows ARM64 Checksums:\n```\n" + "".join(entries) + "```\n"

          with open('body.txt', 'w', encoding='utf-8') as f:
              f.write(content)
          EOF
          cat body.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.VERSION }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          body_path: body.txt
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
